name: CI
on:
  push: { branches: [main] }
  pull_request:

concurrency: { group: "ci-${{ github.ref }}", cancel-in-progress: true }
permissions: { contents: read }

jobs:
  quality:
    name: Lint · types · unit tests · coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: sambhav_test }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sambhav_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm i -g npm@11 && npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage               # engines + API (52 tests) with coverage thresholds
      - run: npm run test -w @sambhav/web   # XSS-safe chat formatting, SSE parsing, palette
      - name: Schema drift (migrations match schema.ts)
        working-directory: apps/api
        run: npx drizzle-kit check && npx drizzle-kit generate --name drift-check | tee /tmp/gen.txt && grep -q "No schema changes" /tmp/gen.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: coverage, path: "**/coverage/lcov.info" }

  e2e:
    name: Browser end-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: quality
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres, POSTGRES_DB: sambhav_e2e }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/sambhav_e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm i -g npm@11 && npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: always()
        with: { name: playwright-report, path: playwright-report }

  build:
    name: Production build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm i -g npm@11 && npm ci
      - run: npm run build
      - run: docker build -t sambhav:ci .
