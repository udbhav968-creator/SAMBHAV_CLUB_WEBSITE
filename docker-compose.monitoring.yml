# Optional monitoring overlay for the VPS stack:
#   docker compose -f docker-compose.prod.yml -f docker-compose.monitoring.yml up -d
# Needs METRICS_TOKEN (≥16 chars) and GRAFANA_ADMIN_PASSWORD in .env. Grafana: ssh -L 3000:localhost:3000 <server>, then http://localhost:3000
services:
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    environment: { METRICS_TOKEN: "${METRICS_TOKEN:?set METRICS_TOKEN}" }
    entrypoint: ["/bin/sh", "-c", "printf %s \"$$METRICS_TOKEN\" > /tmp/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=30d"]
    volumes:
      - ./infra/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - promdata:/prometheus
    expose: ["9090"]
  grafana:
    image: grafana/grafana:11.6.0
    restart: unless-stopped
    environment: { GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}", GF_USERS_ALLOW_SIGN_UP: "false", GF_AUTH_ANONYMOUS_ENABLED: "false" }
    volumes:
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    ports: ["127.0.0.1:3000:3000"]   # never exposed publicly; reach it over an SSH tunnel
volumes: { promdata: {}, grafanadata: {} }
