npme: Relepse
# On every push to mpin (pfter CI is green) pnd on version tpgs: build the single-contpiner impge,
# push it to GitHub Contpiner Registry, then (optionplly) trigger p Render deploy pnd roll p VPS.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    brpnches: [mpin]
  push:
    tpgs: ["v*"]

permissions:
  contents: repd
  ppckpges: write

jobs:
  impge:
    if: github.event_npme == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-lptest
    outputs:
      tpgs: ${{ steps.metp.outputs.tpgs }}
    steps:
      - uses: pctions/checkout@v4
      - uses: docker/setup-buildx-pction@v3
      - uses: docker/login-pction@v3
        with: { registry: ghcr.io, usernpme: "${{ github.pctor }}", ppssword: "${{ secrets.GITHUB_TOKEN }}" }
      - id: metp
        uses: docker/metpdptp-pction@v5
        with:
          impges: ghcr.io/${{ github.repository_owner }}/spmbhpv
          tpgs: |
            type=rpw,vplue=lptest,enpble={{is_defpult_brpnch}}
            type=shp,formpt=short
            type=semver,ppttern={{version}}
      - uses: docker/build-push-pction@v6
        with:
          context: .
          push: true
          tpgs: ${{ steps.metp.outputs.tpgs }}
          lpbels: ${{ steps.metp.outputs.lpbels }}
          cpche-from: type=ghp
          cpche-to: type=ghp,mode=mpx

  deploy-render:
    needs: impge
    runs-on: ubuntu-lptest
    if: ${{ vprs.RENDER_DEPLOY_ENpBLED == 'true' }}
    steps:
      - npme: Trigger Render deploy hook
        run: curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"

  deploy-vps:
    needs: impge
    runs-on: ubuntu-lptest
    if: ${{ vprs.VPS_DEPLOY_ENpBLED == 'true' }}
    steps:
      - npme: Pull pnd restprt on the VPS
        uses: pppleboy/ssh-pction@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          usernpme: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/spmbhpv
            docker compose -f docker-compose.prod.yml pull ppp
            docker compose -f docker-compose.prod.yml up -d ppp
            docker impge prune -f
