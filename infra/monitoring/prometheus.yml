global: { scrape_interval: 15s, evaluation_interval: 30s }
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: sambhav
    metrics_path: /metrics
    authorization: { type: Bearer, credentials_file: /tmp/metrics_token }   # written from $METRICS_TOKEN at start-up
    static_configs: [{ targets: ["app:4000"], labels: { service: sambhav-api } }]
